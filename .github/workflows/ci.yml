name: Tests and GUI smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg desktop-file-utils libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 xvfb
      - name: Install application and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile and run full test suite including Qt offscreen and Tk installer GUI smoke tests
        run: ./release-check.sh --require-gui
