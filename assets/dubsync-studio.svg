<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">DubSync Studio</title>
  <desc id="desc">Zwei synchronisierte Audio-Wellen mit gemeinsamer Zeitmarke</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172c49"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee7ff"/>
      <stop offset="1" stop-color="#3188ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bd9cff"/>
      <stop offset="1" stop-color="#7860ff"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61f2c2"/>
      <stop offset="1" stop-color="#38c8a2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="3" y="3" width="122" height="122" rx="34" fill="url(#shell)" stroke="#304966" stroke-width="2"/>
  <circle cx="64" cy="64" r="45" fill="none" stroke="#263d59" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="36" fill="none" stroke="#1c334f" stroke-width="1" stroke-dasharray="2 5"/>
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 43h7l4-7 5 17 6-25 7 31 6-19 5 6h2" stroke="url(#cyan)" stroke-width="4.4"/>
    <path d="M22 85h7l4 6 5-15 6 22 7-29 6 17 5-7h2" stroke="url(#violet)" stroke-width="4.4"/>
    <path d="M72 43h4l5-7 5 17 6-25 6 31 6-19 5 6h1" stroke="url(#cyan)" stroke-width="4.4"/>
    <path d="M72 85h4l5 6 5-15 6 22 6-29 6 17 5-7h1" stroke="url(#violet)" stroke-width="4.4"/>
  </g>
  <path d="M64 26v76" fill="none" stroke="url(#mint)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="8.5" fill="#0b1a2b" stroke="url(#mint)" stroke-width="3"/>
  <path d="M61 59.5l7 4.5-7 4.5z" fill="#a5ffe3"/>
  <circle cx="64" cy="64" r="2" fill="#ffffff"/>
</svg>
